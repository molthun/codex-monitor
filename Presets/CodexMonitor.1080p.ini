[MeasureTempsRaw]
Measure=WebParser
URL=file://#@#temps.txt
RegExp=(?siU)CPU=(.*)\nGPUCore=(.*)\nGPUHotspot=(.*)\nGPUMemory=(.*)\nVRAMUsedMB=(.*)\nVRAMTotalMB=(.*)\nVRAMPct=(.*)\nGPUFan=(.*)\nGPUFanPct=(.*)\nCPUFan=(.*)\nBoardFan1=(.*)\nBoardFan2=(.*)\nBoardFan3=(.*)\nBoardFan4=(.*)\nBoardFan5=(.*)\nBoardFan6=(.*)\nBoardFan7=(.*)\nPSUFan=(.*)\nNetEthInMbps=(.*)\nNetEthOutMbps=(.*)\nNetWifiInMbps=(.*)\nNetWifiOutMbps=(.*)\nNetWifiApInMbps=(.*)\nNetWifiApOutMbps=(.*)\nNetWifiActiveMode=(.*)\nNetWifiActiveInMbps=(.*)\nNetWifiActiveOutMbps=(.*)\nNetWifiActiveDlMbps=(.*)\nNetWifiActiveUlMbps=(.*)\nNetLinkMbps=(.*)\nNetSplitMode=(.*)\nNetDownMbps=(.*)\nNetUpMbps=(.*)\nNetWanDownMbps=(.*)\nNetLanDownMbps=(.*)\nNetWanUpMbps=(.*)\nNetLanUpMbps=(.*)\nNetTotalText=(.*)\nNetDownWanText=(.*)\nNetDownLanText=(.*)\nNetUpWanText=(.*)\nNetUpLanText=(.*)\nNetDownWanPct=(.*)\nNetDownTotalPct=(.*)\nNetUpWanPct=(.*)\nNetUpTotalPct=(.*)\nNetPlanDownPct=(.*)\nNetPlanUpPct=(.*)\nNetDownMaxed=(.*)\nNetUpMaxed=(.*)\nNetGraphDownWan=(.*)\nNetGraphDownTotal=(.*)\nNetGraphUpWan=(.*)\nNetGraphUpTotal=(.*)\nNetGraphPlanDown=(.*)\nNetGraphPlanUp=(.*)\nNetGraphScaleText=(.*)\nNetTop1Name=(.*)\nNetTop1Icon=(.*)\nNetTop1Text=(.*)\nNetTop1Scope=(.*)\nNetTop2Name=(.*)\nNetTop2Icon=(.*)\nNetTop2Text=(.*)\nNetTop2Scope=(.*)\nNetTop3Name=(.*)\nNetTop3Icon=(.*)\nNetTop3Text=(.*)\nNetTop3Scope=(.*)\nUpdateAvailable=(.*)\nBridgeSource=
UpdateRate=1
CodePage=65001

